# version field deprecated in compose v2+

services:
  neo4j:
    build:
      context: db/neo4j
      dockerfile: Dockerfile
    container_name: trust-trace-db
    environment:
      NEO4J_AUTH: neo4j/trusttrace
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - trust-trace-network

  postgres:
    image: postgres:15
    container_name: trust-trace-postgres
    environment:
      POSTGRES_USER: trusttrace
      POSTGRES_PASSWORD: trusttrace
      POSTGRES_DB: trusttrace_db
      POSTGRES_HOST_AUTH_METHOD: md5
      PGPASSWORD: trusttrace
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trusttrace -d trusttrace_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trust-trace-network

  scuttle-crab:
    build:
      context: ./rust/scuttle_crab
      dockerfile: Dockerfile
    container_name: scuttle-crab
    working_dir: /workspace/scuttle_crab
    entrypoint: ["scuttle_crab"]
    command: ["crawl"]
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./rust/scuttle_crab:/workspace/scuttle_crab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - trust-trace-network

volumes:
  neo4j_data:
  pgdata:

networks:
  trust-trace-network:
    driver: bridge
