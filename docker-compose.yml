# version field deprecated in compose v2+

services:
  tarkov-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trust-trace-tarkov-api
    environment:
      DATABASE_URL: postgresql://trusttrace:trusttrace@postgres:5432/trusttrace_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: trusttrace
      TARKOV_API_HOST: 0.0.0.0
      TARKOV_API_PORT: 8081
      LOG_LEVEL: INFO
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env or environment}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.4-nano}
      KEYWORDS_FILE_PATH: /app/tarkov/data/aml_keywords.json
      DEAD_LETTER_PATH: /tmp/tarkov_dead_letters.jsonl
      SCUTTLE_CRAB_URL: http://scuttle-crab:3000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8081/health\")" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - trust-trace-network

  neo4j:
    build:
      context: db/neo4j
      dockerfile: Dockerfile
    container_name: trust-trace-db
    environment:
      NEO4J_AUTH: neo4j/trusttrace
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - trust-trace-network

  postgres:
    image: postgres:15
    container_name: trust-trace-postgres
    environment:
      POSTGRES_USER: trusttrace
      POSTGRES_PASSWORD: trusttrace
      POSTGRES_DB: trusttrace_db
      POSTGRES_HOST_AUTH_METHOD: md5
      PGPASSWORD: trusttrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trusttrace -d trusttrace_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trust-trace-network

  scuttle-crab:
    build:
      context: ./rust/scuttle_crab
      dockerfile: Dockerfile
    container_name: scuttle-crab
    working_dir: /workspace/scuttle_crab
    entrypoint: ["scuttle_crab"]
    command: ["serve"]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      SCUTTLE_BIND_ADDR: "0.0.0.0:3000"
      TARKOV_BASE_URL: "http://tarkov-api:8081"
    ports:
      - "3000:3000"
    volumes:
      - ./rust/scuttle_crab:/workspace/scuttle_crab
      - ./test_crawler:/workspace/test_crawler:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      tarkov-api:
        condition: service_healthy
    networks:
      - trust-trace-network

volumes:
  neo4j_data:
  pgdata:

networks:
  trust-trace-network:
    driver: bridge
