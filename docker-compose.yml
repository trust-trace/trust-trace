version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: trust-trace-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trusttrace
    ports:
      - "5432:5432"
    volumes:
      # Persist data between container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trust-trace-network

volumes:
  postgres_data:

networks:
  trust-trace-network:
    driver: bridge
